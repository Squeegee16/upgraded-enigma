# Ham Radio Operator Web Application - Docker Compose
# =====================================================
# Services:
#   app       - Flask web application (port 5000)
#   openwebrx - OpenWebRX SDR receiver sidecar (port 8073)
#   backup    - Automated SQLite database backup
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f app    # Follow app logs
#   docker compose build          # Rebuild app image
#
# RTL-SDR device assignment:
#   The RTL-SDR can only be used by ONE container at a time.
#   By default it is passed to the openwebrx container.
#   If OpenWebRX is not used, assign it to the app service
#   by moving the devices block from openwebrx to app.

# ============================================================
# Named Volumes
# ============================================================
volumes:
  # Single volume for all application persistent data.
  # Subdirectories created by entrypoint script:
  #   /data/db          - SQLite database
  #   /data/certs       - SSL certificates
  #   /data/backups     - Database backups
  #   /data/callsigns   - ISED callsign database
  #   /data/logs        - Application logs
  #   /data/plugins     - Plugin data
  app_data:
    driver: local

  # Separate volume for OpenWebRX configuration.
  openwebrx_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  hamradio_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Services
# ============================================================
services:

  # ==========================================================
  # Main Ham Radio Application
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hamradio_app
    restart: unless-stopped

    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      - DATABASE_URL=sqlite:////data/db/ham_radio.db
      - USE_MOCK_DEVICES=${USE_MOCK_DEVICES:-true}
      - GPS_SOURCE=${GPS_SOURCE:-uart}
      - GPS_SERIAL_PORT=${GPS_SERIAL_PORT:-/dev/ttyAMA0}
      - GPS_BAUD_RATE=${GPS_BAUD_RATE:-9600}
      - RADIO_MODEL=${RADIO_MODEL:-1035}
      - RADIO_PORT=${RADIO_PORT:-/dev/ttyUSB1}
      - RADIO_BAUD_RATE=${RADIO_BAUD_RATE:-38400}
      - SDR_DEVICE_INDEX=${SDR_DEVICE_INDEX:-0}
      - SDR_SAMPLE_RATE=${SDR_SAMPLE_RATE:-2048000}
      - USE_SSL=${USE_SSL:-true}
      - SSL_CERT=/data/certs/cert.pem
      - SSL_KEY=/data/certs/key.pem
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - VALIDATE_CALLSIGNS=${VALIDATE_CALLSIGNS:-false}
      - TZ=${TZ:-UTC}
      - PLUGIN_SKIP_PIP_INSTALL=true
      - OPENWEBRX_URL=http://openwebrx:8073
      # USB Sound Card: Creative SoundBlaster Play 3
      # Device is auto-detected by the entrypoint script.
      # Override here if auto-detection picks wrong card:
      - AUDIO_DEVICE=${AUDIO_DEVICE:-}
      - AUDIO_INPUT_DEVICE=${AUDIO_INPUT_DEVICE:-}
      - AUDIO_OUTPUT_DEVICE=${AUDIO_OUTPUT_DEVICE:-}

    volumes:
      # Single volume covers all /data subdirectories
      - app_data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
    # USB device passthrough for GPS and Radio CAT port.
    # RTL-SDR is passed to openwebrx service below.
    # Uncomment when real hardware is connected.
    #
    devices:
      - /dev/bus/usb:/dev/bus/usb
      # Uncomment for UART GPS on Raspberry Pi:
      # - /dev/ttyAMA0:/dev/ttyAMA0    # Pi hardware UART
      # - /dev/ttyUSB0:/dev/ttyUSB0    # GPS
      # - /dev/ttyUSB1:/dev/ttyUSB1    # Radio CAT
    
    privileged: true
    
    networks:
      - hamradio_net

    depends_on:
      - openwebrx

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "com.hamradio.service=app"
      - "com.hamradio.version=0.2.0"


  # ==========================================================
  # OpenWebRX SDR Receiver - Official Docker Image
  # https://github.com/jketterl/openwebrx
  #
  # Runs as a sidecar. The app communicates with it via
  # http://openwebrx:8073 on the internal Docker network.
  # Web interface exposed on host port 8073.
  # ==========================================================
  openwebrx:
    image: jketterl/openwebrx:stable

    container_name: hamradio_openwebrx
    restart: unless-stopped

    ports:
      - "8073:8073"

    volumes:
      - openwebrx_data:/var/lib/openwebrx

    # RTL-SDR USB device passthrough.
    # The RTL-SDR is assigned to THIS container.
    # Do NOT also assign it to the app service above.
    # Uncomment when RTL-SDR dongle is connected.
    #
    devices:
      - /dev/bus/usb:/dev/bus/usb
      # GPS on USB serial — uncomment when connected
      - /dev/ttyUSB0:/dev/ttyUSB0
      # If GPS is on Raspberry Pi hardware UART:
      - /dev/ttyAMA0:/dev/ttyAMA0
    privileged: true

    networks:
      - hamradio_net

    cap_add:
      - SYS_NICE

    environment:
      - TZ=${TZ:-UTC}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "com.hamradio.service=openwebrx"


  # ==========================================================
  # Database Backup Service
  # ==========================================================
  backup:
    image: alpine:latest
    container_name: hamradio_backup
    restart: unless-stopped

    environment:
      # Backup interval in seconds (default: 24 hours)
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-86400}
      # Days to keep backup files (default: 7 days)
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}

    volumes:
      - app_data:/data:rw

    command: >
      sh -c '
      echo "Backup service starting...";
      echo "Interval: $${BACKUP_INTERVAL}s | Retention: $${BACKUP_RETENTION}d";
      mkdir -p /data/backups;
      while true; do
        if [ -f /data/db/ham_radio.db ]; then
          TS=$$(date +%Y%m%d_%H%M%S);
          BF="/data/backups/ham_radio_$${TS}.db";
          if cp /data/db/ham_radio.db "$${BF}"; then
            gzip "$${BF}";
            echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Created: $${BF}.gz";
          fi;
          find /data/backups -name "ham_radio_*.db.gz" \
            -mtime +$${BACKUP_RETENTION} -delete;
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Pruned backups older than $${BACKUP_RETENTION}d";
        else
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] DB not found";
        fi;
        sleep $${BACKUP_INTERVAL};
      done
      '

    networks:
      - hamradio_net

    depends_on:
      - app

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    labels:
      - "com.hamradio.service=backup"
