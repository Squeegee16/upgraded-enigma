# Ham Radio Operator Web Application - Docker Compose
# =====================================================

# ============================================================
# Named Volumes
# ============================================================
volumes:
  app_data:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  hamradio_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Services
# ============================================================
services:

  # ==========================================================
  # rigctld - Hamlib Radio Control Daemon 4.7.0
  # ==========================================================
  rigctld:
    build:
      context: .
      dockerfile: Dockerfile.rigctld
    container_name: rigctld
    restart: unless-stopped
    ports:
      - "4533:4533"
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: false
    environment:
      - RIGCTLD_MODEL=1035
      - RIGCTLD_PORT=/dev/ttyUSB0
      - RIGCTLD_BAUD=38400
      - RIGCTLD_LISTEN_PORT=4533
    command:
      - sh
      - -c
      - |
        echo "=== rigctld startup ===";
        echo "Binary  : $$(which rigctld)";
        echo "Version : $$(/usr/local/bin/rigctld --version 2>&1 | head -1)";
        echo "Model   : $${RIGCTLD_MODEL}";
        echo "Port    : $${RIGCTLD_PORT}";
        echo "Baud    : $${RIGCTLD_BAUD}";
        echo "Listen  : $${RIGCTLD_LISTEN_PORT}";
        echo "Waiting for $${RIGCTLD_PORT}...";
        WAIT=0;
        while [ ! -e "$${RIGCTLD_PORT}" ]; do
          sleep 1;
          WAIT=$$((WAIT+1));
          if [ "$$WAIT" -ge 30 ]; then
            echo "ERROR: $${RIGCTLD_PORT} not found after 30s - starting anyway";
            break;
          fi;
        done;
        echo "Starting /usr/local/bin/rigctld...";
        exec /usr/local/bin/rigctld \
          -m "$${RIGCTLD_MODEL}" \
          -r "$${RIGCTLD_PORT}" \
          -s "$${RIGCTLD_BAUD}" \
          -t "$${RIGCTLD_LISTEN_PORT}" \
          -vvvvv
    networks:
      - hamradio_net
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - "echo 'f' | nc -w 2 localhost 4533"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.hamradio.service=rigctld"
      - "com.hamradio.hamlib-version=4.7.0"

  # ==========================================================
  # Main Ham Radio Application
  # ==========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hamradio_app
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "7362:7362"
      - "8080:8080"
      - "2237:2237"
      - "8227:8227"
      - "5999:5999"
      - "2947:2947"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
      - DATABASE_URL=sqlite:////data/db/ham_radio.db
      - USE_MOCK_DEVICES=${USE_MOCK_DEVICES:-true}
      - GPS_SOURCE=${GPS_SOURCE:-uart}
      - GPS_SERIAL_PORT=${GPS_SERIAL_PORT:-/dev/ttyAMA0}
      - GPS_BAUD_RATE=${GPS_BAUD_RATE:-9600}
      - RADIO_MODEL=${RADIO_MODEL:-1035}
      - RADIO_PORT=${RADIO_PORT:-/dev/ttyUSB1}
      - RADIO_BAUD_RATE=${RADIO_BAUD_RATE:-38400}
      - SDR_DEVICE_INDEX=${SDR_DEVICE_INDEX:-0}
      - SDR_SAMPLE_RATE=${SDR_SAMPLE_RATE:-2048000}
      - USE_SSL=${USE_SSL:-true}
      - SSL_CERT=/data/certs/cert.pem
      - SSL_KEY=/data/certs/key.pem
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - VALIDATE_CALLSIGNS=${VALIDATE_CALLSIGNS:-false}
      - TZ=${TZ:-UTC}
      - PLUGIN_SKIP_PIP_INSTALL=true
      - AUDIO_DEVICE=${AUDIO_DEVICE:-}
      - AUDIO_INPUT_DEVICE=${AUDIO_INPUT_DEVICE:-}
      - AUDIO_OUTPUT_DEVICE=${AUDIO_OUTPUT_DEVICE:-}
      - QT_QPA_PLATFORM=${QT_QPA_PLATFORM:-xcb}
      - QT_DEBUG_PLUGINS=${QT_DEBUG_PLUGINS:-1}
      - XVFB_DISPLAY=${XVFB_DISPLAY:-":99"}
      - XVFB_READY=${XVFB_READY:-false}
      - RIGCTLD_HOST=rigctld
      - RIGCTLD_PORT=4533
    volumes:
      - app_data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/ttyAMA0:/dev/ttyAMA0
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
      - /dev/snd/controlC0:/dev/snd/controlC0
      - /dev/snd/pcmC0D0c:/dev/snd/pcmC0D0c
      - /dev/snd/pcmC0D0p:/dev/snd/pcmC0D0p
      - /dev/input/event0:/dev/input/event0
    privileged: true
    networks:
      - hamradio_net
    depends_on:
      - rigctld
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen('http://localhost:5000/')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.hamradio.service=app"
      - "com.hamradio.version=0.2.0"

